name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/validate_locales.py
      - run: python scripts/export_schemas.py --check
      - run: python scripts/release_check.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/rigorgraph/viewer/index.html

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m build

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: rigorgraph demo action-demo --scenario benchmark
      - uses: ./
        with:
          path: action-demo
          fail-on: error

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [python, frontend, quality, action]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        run: |
          for result in \
            "${{ needs.python.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.quality.result }}" \
            "${{ needs.action.result }}"; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with status: ${result}"
              exit 1
            fi
          done

name: Registry smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact PyPI version to install
        required: true
        default: "1.0.0rc2"
        type: string

permissions:
  contents: read

jobs:
  fresh-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      RIGORGRAPH_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install from public PyPI
        run: >-
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple
          "rigorgraph==${{ env.RIGORGRAPH_VERSION }}"
      - name: Verify installed CLI
        run: rigorgraph --version
      - name: Exercise installed package
        run: |
          rigorgraph demo registry-smoke --scenario math
          rigorgraph audit registry-smoke --json

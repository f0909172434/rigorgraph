name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release tag matches the package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}."
            exit 1
          fi
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/rigorgraph/viewer/index.html
      - run: python -m pip install -e ".[dev]"
      - run: rm -rf dist && mkdir dist
      - run: python scripts/release_check.py --full
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/rigorgraph-smoke
          /tmp/rigorgraph-smoke/bin/python -m pip install dist/*.whl
          /tmp/rigorgraph-smoke/bin/rigorgraph demo /tmp/rigorgraph-demo --scenario math
          /tmp/rigorgraph-smoke/bin/rigorgraph audit /tmp/rigorgraph-demo
      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist
      - name: Keep only Python distributions
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RigorGraph ${GITHUB_REF_NAME#v}" \
            --generate-notes
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            release_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type + " " + .object.sha')"
            read -r object_type release_sha <<< "${release_object}"
            if [[ "${object_type}" == "tag" ]]; then
              release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '.object.sha')"
            fi
            release_version="${GITHUB_REF_NAME#v}"
            major_alias="v${release_version%%.*}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major_alias}" --silent; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major_alias}" \
                -f sha="${release_sha}" -F force=true --silent
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${major_alias}" -f sha="${release_sha}" --silent
            fi
          fi

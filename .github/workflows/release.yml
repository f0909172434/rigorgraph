name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v1.0.0"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/rigorgraph/viewer/index.html
      - run: python -m pip install -e ".[dev]"
      - run: rm -rf dist && mkdir dist
      - run: python scripts/release_check.py --full
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/rigorgraph-smoke
          /tmp/rigorgraph-smoke/bin/python -m pip install dist/*.whl
          /tmp/rigorgraph-smoke/bin/rigorgraph demo /tmp/rigorgraph-demo --scenario math
          /tmp/rigorgraph-smoke/bin/rigorgraph audit /tmp/rigorgraph-demo
      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Keep only Python distributions
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RigorGraph ${GITHUB_REF_NAME#v}" \
            --generate-notes

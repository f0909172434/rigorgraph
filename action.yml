name: RigorGraph Audit
description: Audit claim-evidence records and generate an offline report.
author: Wang Zhi-Kai
branding:
  icon: check-circle
  color: purple
inputs:
  path:
    description: Path to the RigorGraph project.
    required: false
    default: .
  fail-on:
    description: "Failure threshold: error, warning, or never."
    required: false
    default: error
  report:
    description: Report filename relative to the project path.
    required: false
    default: rigorgraph-report.html
outputs:
  report:
    description: Absolute path to the generated report.
    value: ${{ steps.audit.outputs.report }}
  status:
    description: PASS or FAIL.
    value: ${{ steps.audit.outputs.status }}
runs:
  using: composite
  steps:
    - name: Install RigorGraph from this action
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Audit and generate report
      id: audit
      shell: bash
      run: >-
        python "$GITHUB_ACTION_PATH/scripts/action_runner.py"
        --path "${{ inputs.path }}"
        --fail-on "${{ inputs.fail-on }}"
        --report "${{ inputs.report }}"
    - name: Upload offline report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rigorgraph-report
        path: ${{ steps.audit.outputs.report }}
        if-no-files-found: error

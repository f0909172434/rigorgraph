<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RigorGraph claim evidence flow</title>
  <desc id="desc">Research claims connect to scoped evidence, independent verification, and a deterministic audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14245d"/><stop offset="1" stop-color="#6c55c9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <text x="64" y="78" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="750">RigorGraph</text>
  <text x="64" y="112" fill="#cdd3ff" font-family="system-ui,sans-serif" font-size="17">Claim → scoped evidence → independent verification → auditable report</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <g transform="translate(64 165)"><rect width="220" height="150" rx="22" fill="#fff"/><text x="24" y="42" fill="#5b6cff" font-size="14" font-weight="700">01 / CLAIM</text><text x="24" y="78" fill="#1e2440" font-size="22" font-weight="700">Exact statement</text><text x="24" y="108" fill="#68708d" font-size="14">Type · authors · dependencies</text><text x="24" y="132" fill="#68708d" font-size="14">DRAFT / PROPOSED</text></g>
    <g transform="translate(358 165)"><rect width="220" height="150" rx="22" fill="#fff"/><text x="24" y="42" fill="#5b6cff" font-size="14" font-weight="700">02 / EVIDENCE</text><text x="24" y="78" fill="#1e2440" font-size="22" font-weight="700">Scoped support</text><text x="24" y="108" fill="#68708d" font-size="14">Proof · source · data · run</text><text x="24" y="132" fill="#68708d" font-size="14">Locator · SHA-256</text></g>
    <g transform="translate(652 165)"><rect width="220" height="150" rx="22" fill="#fff"/><text x="24" y="42" fill="#5b6cff" font-size="14" font-weight="700">03 / VERIFY</text><text x="24" y="78" fill="#1e2440" font-size="22" font-weight="700">Independent check</text><text x="24" y="108" fill="#68708d" font-size="14">ACCEPT · REJECT</text><text x="24" y="132" fill="#68708d" font-size="14">UNCERTAIN</text></g>
    <g transform="translate(946 165)"><rect width="190" height="150" rx="22" fill="#e4faef"/><text x="24" y="42" fill="#087f5b" font-size="14" font-weight="700">04 / AUDIT</text><text x="24" y="78" fill="#164c3d" font-size="22" font-weight="700">Traceable</text><text x="24" y="108" fill="#3c7363" font-size="14">Offline graph report</text><text x="24" y="132" fill="#3c7363" font-size="14">Not absolute truth</text></g>
  </g>
  <g stroke="#bfc8ff" stroke-width="4" fill="none"><path d="M290 240h54"/><path d="M584 240h54"/><path d="M878 240h54"/></g>
  <g fill="#bfc8ff"><path d="m344 240-14-9v18z"/><path d="m638 240-14-9v18z"/><path d="m932 240-14-9v18z"/></g>
  <text x="64" y="372" fill="#dbe0ff" font-family="system-ui,sans-serif" font-size="14">English · 繁體中文 · 简体中文 · 日本語　/　local-first · no telemetry · no built-in paid model API</text>
</svg>

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rigorgraph"
version = "1.0.0rc1"
description = "Turn AI research into auditable claim-evidence graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wang Zhi-Kai" }]
keywords = ["research", "verification", "evidence", "ai-agents", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
rigorgraph = "rigorgraph.cli:app"

[project.urls]
Homepage = "https://github.com/f0909172434/rigorgraph"
Repository = "https://github.com/f0909172434/rigorgraph"
Issues = "https://github.com/f0909172434/rigorgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rigorgraph"]

[tool.hatch.build]
include = [
  "src/rigorgraph/**/*.py",
  "src/rigorgraph/locales/*.json",
  "src/rigorgraph/viewer/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

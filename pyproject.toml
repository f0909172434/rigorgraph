[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "rigorgraph"
version = "1.0.1"
description = "Public-beta, local-first claim-evidence graphs for auditable AI research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wang Chih Kai" }]
keywords = ["research", "verification", "evidence", "ai-agents", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.3,<7",
  "rich>=15.0.0,<16",
  "typer>=0.27.1,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
]

[project.scripts]
rigorgraph = "rigorgraph.cli:app"

[project.urls]
Homepage = "https://github.com/f0909172434/rigorgraph"
Repository = "https://github.com/f0909172434/rigorgraph"
Issues = "https://github.com/f0909172434/rigorgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rigorgraph"]

[tool.hatch.build]
include = [
  "src/rigorgraph/**/*.py",
  "src/rigorgraph/locales/*.json",
  "src/rigorgraph/viewer/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
